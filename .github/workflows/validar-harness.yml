name: Validar Kilo Global Harness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  powershell-windows:
    runs-on: windows-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Python 3.13 para VX Evolution
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Analisis estatico y smoke test aislado
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Instalar-Kilo-Global-Harness.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
          $tmp = Join-Path $env:RUNNER_TEMP 'kilo-harness-smoke'
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          $script = (Resolve-Path 'scripts/Instalar-Kilo-Global-Harness.ps1').Path
          & $script -Modo Diagnostico -RaizUsuario $tmp
          & $script -Modo Simular -RaizUsuario $tmp
          & $script -Modo Aplicar -RaizUsuario $tmp -PausarTaskObserver
          & $script -Modo Verificar -RaizUsuario $tmp
          $backup = Get-ChildItem (Join-Path $tmp '.config/kilo-harness-backups') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          & $script -Modo Restaurar -RaizUsuario $tmp -BackupFolder $backup.FullName
          if (Test-Path (Join-Path $tmp '.config/kilo/AGENTS.md')) { throw 'Restaurar dejo AGENTS.md de prueba.' }
          Write-Host 'SMOKE TEST PASSED'

      - name: Auditar fixture JSONC sin filtrar secretos
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'kilo-global-audit-fixture'
          $cfg = Join-Path $tmp '.config/kilo'
          New-Item -ItemType Directory -Path (Join-Path $cfg 'agents') -Force | Out-Null
          @'
          {
            // Datos ficticios de CI
            "agent": {
              "architect": { "steps": 10000000, },
            },
            "mcp": {
              "imagegen": { "type": "local", "enabled": true,
                            "environment": { "SECRET": "CI_SECRET_NEVER_PRINT_123" } }
            }
          }
          '@ | Set-Content (Join-Path $cfg 'kilo.jsonc') -Encoding utf8
          '---' | Set-Content (Join-Path $cfg 'agents/architect.md')
          $auditScript = (Resolve-Path 'scripts/Auditar-Kilo-Global.ps1').Path
          $err = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile($auditScript,[ref]$tokens,[ref]$err) | Out-Null
          if ($err.Count -gt 0) { throw "Error de sintaxis en auditoría: $($err | Out-String)" }
          $jsonText = & $auditScript -RaizUsuario $tmp -Json | Out-String
          if ($jsonText -match 'CI_SECRET_NEVER_PRINT_123') { throw 'La auditoria filtro una credencial.' }
          $r = $jsonText | ConvertFrom-Json
          if ($r.high_steps_over_400.Count -ne 1) { throw 'No detecto steps elevados.' }
          if ($r.duplicates_merged_by_kilo.Count -ne 1) { throw 'No detecto agente compartido.' }
          if (!$r.imagegen_configured) { throw 'No detecto imagegen.' }
          Write-Host 'AUDITORIA GLOBAL SIN SECRETOS: PASS'

      - name: V4 - validar registro, equipos, global-only y rollback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(Get-ChildItem scripts -Filter '*.ps1')) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,[ref]$tokens,[ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "Error sintaxis: $($file.Name) $($errors | Out-String)" }
          }
          $validator = (Resolve-Path 'scripts/Validar-Registro-V4.ps1').Path
          $selector = (Resolve-Path 'scripts/Seleccionar-Equipo-V4.ps1').Path
          $installer = (Resolve-Path 'scripts/Instalar-Kilo-Global-Harness.ps1').Path
          & $validator
          $profiles = @('general','backend','frontend','cloudflare','database','security','refactor','design','docs')
          foreach ($name in $profiles) {
            $v = (& $selector -Perfil $name -Json | Out-String | ConvertFrom-Json)
            if ($v.profile -ne $name -or $v.max_writers -ne 1 -or $v.actions_executed -ne 0) {
              throw "Selector invalido: $name"
            }
            if (@($v.discover_parallel).Count -gt 3 -or @($v.review_parallel).Count -gt 3) {
              throw "Paralelismo excesivo: $name"
            }
          }
          $auto = (& $selector -Tarea 'Corregir UI React y CSS' -Json | Out-String | ConvertFrom-Json)
          if ($auto.profile -ne 'frontend') { throw 'Deteccion automatica frontend fallida.' }
          $read = (& $selector -Perfil cloudflare -SoloLectura -MaxLectores 1 -Json |
            Out-String | ConvertFrom-Json)
          if ($read.max_writers -ne 0 -or $read.implementation -or @($read.discover_parallel).Count -gt 1) {
            throw 'SoloLectura o MaxLectores incumplidos.'
          }
          $broken = Get-Content 'registry/vx-agent-registry-v4.json' -Raw | ConvertFrom-Json -AsHashtable
          $broken.execution.max_writers = 2
          $bad = Join-Path $env:RUNNER_TEMP 'vx-invalid-registry.json'
          $broken | ConvertTo-Json -Depth 30 | Set-Content $bad -Encoding utf8
          $rejected = $false
          try { & $validator -RutaRegistro $bad | Out-Null } catch { $rejected = $true }
          if (!$rejected) { throw 'Validador acepto multiples escritores.' }
          $fixture = Join-Path $env:RUNNER_TEMP ('vx-v4-' + [guid]::NewGuid().ToString('N'))
          $cfg = Join-Path $fixture '.config/kilo'
          New-Item -ItemType Directory -Path $cfg -Force | Out-Null
          '{"mcp":{"imagegen":{"enabled":true}},"agent":{"code":{"steps":10000000}},"secret":"CI_CANARY_DO_NOT_PRINT"}' |
            Set-Content (Join-Path $cfg 'kilo.jsonc') -Encoding utf8
          $before = (Get-FileHash (Join-Path $cfg 'kilo.jsonc') -Algorithm SHA256).Hash
          & $installer -Modo Diagnostico -RaizUsuario $fixture
          & $installer -Modo Simular -RaizUsuario $fixture
          & $installer -Modo Aplicar -RaizUsuario $fixture
          & $installer -Modo Verificar -RaizUsuario $fixture
          if (!(Test-Path (Join-Path $cfg 'harness/vx-agent-registry-v4.json'))) {
            throw 'No se instalo registro global.'
          }
          if (!(Test-Path (Join-Path $cfg 'agents/vx-security-reviewer.md'))) {
            throw 'No se instalo subagente.'
          }
          # Probar el validador EXACTAMENTE desde su ruta instalada en HOME.
          # Detecta regresiones de rutas repo/ vs global/harness/.
          $installedValidator = Join-Path $cfg 'harness/scripts/Validar-Registro-V4.ps1'
          & $installedValidator
          $after = (Get-FileHash (Join-Path $cfg 'kilo.jsonc') -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'Se modifico kilo.jsonc privado.' }
          $fromGlobal = (& $selector -RaizUsuario $fixture -Perfil cloudflare -Json |
            Out-String | ConvertFrom-Json)
          if ($fromGlobal.profile -ne 'cloudflare') { throw 'Selector no utilizo registro global.' }
          $backup = Get-ChildItem (Join-Path $fixture '.config/kilo-harness-backups') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          & $installer -Modo Restaurar -RaizUsuario $fixture -BackupFolder $backup.FullName
          if (Test-Path (Join-Path $cfg 'harness/vx-agent-registry-v4.json')) {
            throw 'Rollback no retiro registro nuevo.'
          }
          if (Test-Path (Join-Path $cfg 'agents/vx-security-reviewer.md')) {
            throw 'Rollback no retiro agente nuevo.'
          }
          $restored = (Get-FileHash (Join-Path $cfg 'kilo.jsonc') -Algorithm SHA256).Hash
          if ($restored -ne $before) { throw 'Rollback altero configuracion privada.' }
          Write-Host 'V4 GLOBAL-ONLY, SEGURIDAD, ROUTING Y ROLLBACK: PASS'

      - name: V4.1 - auditoria de evidencias y comando global
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Get-Content 'commands/vx-revalidar.md' -Raw -Encoding UTF8
          $doc = Get-Content 'docs/PROTOCOLO-REVALIDACION-V4.1.md' -Raw -Encoding UTF8
          if ($cmd -notmatch '(?ms)\A---\r?\n.*?agent:\s*plan.*?\r?\n---') {
            throw 'El comando vx-revalidar carece de frontmatter valido.'
          }
          foreach ($word in @('DESCARTADO', 'NO VERIFICADO', 'git rev-parse', 'git fetch', 'SOLO LECTURA')) {
            if (!$cmd.Contains($word)) { throw "Falta condicion del comando: $word" }
          }
          foreach ($word in @('PASS', 'FAIL', 'DESCARTADO', 'NO VERIFICADO', 'origin/main', 'HEAD')) {
            if (!$doc.Contains($word)) { throw "Falta condicion del protocolo: $word" }
          }
          $root = Join-Path $env:RUNNER_TEMP ('vx41-' + [guid]::NewGuid().ToString('N'))
          $installer = (Resolve-Path 'scripts/Instalar-Kilo-Global-Harness.ps1').Path
          # PowerShell & script no redefine LASTEXITCODE: validar manifest y archivos; el instalador lanza excepcion al fallar.
          & $installer -Modo Aplicar -RaizUsuario $root
          $installed = Join-Path $root '.config/kilo/commands/vx-revalidar.md'
          if (!(Test-Path -LiteralPath $installed -PathType Leaf)) {
            throw 'El comando V4.1 no fue instalado globalmente.'
          }
          if ((Get-FileHash $installed).Hash -ne (Get-FileHash 'commands/vx-revalidar.md').Hash) {
            throw 'No coincide comando global con el repositorio.'
          }
          & $installer -Modo Verificar -RaizUsuario $root
          Write-Host 'V4.1 EVIDENCE-GATE Y GLOBAL-ONLY: PASS'

      - name: V4.2 - reconciliar agentes de forma segura
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path 'scripts/Reconciliar-Agentes-V4.2.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $script,[ref]$tokens,[ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw "Error sintaxis V4.2: $($errors | Out-String)" }
          $fixture = Join-Path $env:RUNNER_TEMP ('vx42-' + [guid]::NewGuid().ToString('N'))
          $cfg = Join-Path $fixture '.config/kilo'
          New-Item -ItemType Directory -Force -Path (Join-Path $cfg 'agents') | Out-Null
          @'
          {
            // Solo datos ficticios de CI.
            "agent": {
              "architect": {
                "mode": "primary",
                "steps": 10000000,
                "description": "CI_CANARY_ONLY_NOT_REAL_123",
                "prompt": "CI_CANARY_ONLY_NOT_REAL_123",
                "permission": { "edit": "allow", "bash": { "*": "deny" } },
              },
              "code": { "steps": 10000000 },
              "only-json": { "steps": 24 }
            }
          }
          '@ | Set-Content (Join-Path $cfg 'kilo.jsonc') -Encoding UTF8
          @'
          ---
          description: "CI_CANARY_ONLY_NOT_REAL_123"
          mode: subagent
          steps: 45
          permission:
            edit: deny
            bash: deny
          ---
          CI_CANARY_ONLY_NOT_REAL_123
          '@ | Set-Content (Join-Path $cfg 'agents/architect.md') -Encoding UTF8
          $before = (Get-FileHash (Join-Path $cfg 'kilo.jsonc') -Algorithm SHA256).Hash
          $out = (& $script -RaizUsuario $fixture -Json | Out-String)
          if ($out -match 'CI_CANARY_ONLY_NOT_REAL_123') { throw 'El informe muestra contenido privado.' }
          $report = $out | ConvertFrom-Json
          if ($report.agentes_json -ne 3 -or $report.agentes_markdown -ne 1) {
            throw 'Conteo de fuentes V4.2 incorrecto.'
          }
          if ($report.agentes_en_ambos -ne 1 -or $report.limites_steps_superiores_al_umbral -ne 2) {
            throw 'No identifica coincidencias o pasos excesivos.'
          }
          $a = @($report.coincidencias)[0]
          foreach ($field in @('steps','mode','permission.edit')) {
            $hit = @($a.campos_solapados | Where-Object { $_.campo -eq $field })
            if ($hit.Count -ne 1 -or $hit[0].estado -ne 'DIFERENCIA_EXPLICITA') {
              throw "No se detecto conflicto explicito: $field"
            }
          }
          $bash = @($a.campos_solapados | Where-Object { $_.campo -eq 'permission.bash' })
          if ($bash.Count -ne 1 -or $bash[0].estado -ne 'REGLAS_COMPUESTAS_REVISAR_PRECEDENCIA') {
            throw 'No se detecto permiso compuesto.'
          }
          $after = (Get-FileHash (Join-Path $cfg 'kilo.jsonc') -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'El auditor cambio kilo.jsonc.' }
          $installer = (Resolve-Path 'scripts/Instalar-Kilo-Global-Harness.ps1').Path
          $fresh = Join-Path $env:RUNNER_TEMP ('vx42-inst-' + [guid]::NewGuid().ToString('N'))
          & $installer -Modo Aplicar -RaizUsuario $fresh
          $installed = Join-Path $fresh '.config/kilo/harness/scripts/Reconciliar-Agentes-V4.2.ps1'
          if (!(Test-Path -LiteralPath $installed -PathType Leaf)) { throw 'Falta auditor V4.2 global.' }
          $audit = & $installed -RaizUsuario $fixture -Json | Out-String | ConvertFrom-Json
          if ($audit.agentes_en_ambos -ne 1) { throw 'Auditor global V4.2 no ejecuta.' }
          & $installer -Modo Verificar -RaizUsuario $fresh
          $backup = Get-ChildItem (Join-Path $fresh '.config/kilo-harness-backups') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          & $installer -Modo Restaurar -RaizUsuario $fresh -BackupFolder $backup.FullName
          if (Test-Path $installed) { throw 'Rollback no retiro auditor V4.2.' }
          Write-Host 'V4.2 RECONCILIACION + NO SECRETOS + INSTALACION + ROLLBACK: PASS'

      - name: V4.3 - probar VX Evolution Core sin HOME real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python -I -m unittest discover -s tests -p test_vx_evolution_core.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas de VX Evolution Core' }
          python -m compileall -q scripts/vx_evolution_core.py tests/test_vx_evolution_core.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló compileall VX Evolution' }
          Write-Host 'VX EVOLUTION CORE V4.3: PASS'

      - name: V4.3 - instalar código global sin inicializar ni borrar datos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP ('vx-evo-inst-' + [guid]::NewGuid().ToString('N'))
          $installer = (Resolve-Path 'scripts/Instalar-Kilo-Global-Harness.ps1').Path
          & $installer -Modo Aplicar -RaizUsuario $fixture
          $core = Join-Path $fixture '.config/kilo/harness/scripts/vx_evolution_core.py'
          $skill = Join-Path $fixture '.kilo/skills/vx-evolution-core/SKILL.md'
          $db = Join-Path $fixture '.config/kilo/vx-evolution/vx-evolution.sqlite3'
          if (!(Test-Path $core) -or !(Test-Path $skill)) { throw 'Falta codigo o skill Kilo V4.3.' }
          if (Test-Path $db) { throw 'Instalar no debe crear la BD operativa.' }
          if ((Get-FileHash $core).Hash -ne (Get-FileHash 'scripts/vx_evolution_core.py').Hash) {
            throw 'El core global difiere del codigo fuente.'
          }
          $command = Join-Path $fixture '.config/kilo/commands/vx-reunion.md'
          if (!(Test-Path $command)) { throw 'Falta comando de reunion global.' }
          & $installer -Modo Verificar -RaizUsuario $fixture
          python -I $core --home $fixture init --json
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $db)) { throw 'No se pudo inicializar global.' }
          $backup = Get-ChildItem (Join-Path $fixture '.config/kilo-harness-backups') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          & $installer -Modo Restaurar -RaizUsuario $fixture -BackupFolder $backup.FullName
          if (Test-Path $core) { throw 'Rollback no retiro el codigo V4.3 nuevo.' }
          if (Test-Path $skill) { throw 'Rollback no retiro la skill V4.3 nueva.' }
          if (!(Test-Path $db)) { throw 'Rollback nunca debe borrar la BD privada.' }
          Write-Host 'KILO-ONLY: INSTALACION Y DATOS AISLADOS, ROLLBACK PASS'
