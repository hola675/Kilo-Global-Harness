      - name: V4.5.1 - reunion conjunta sin duplicación ni programador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -m unittest discover -s tests -p 'test_vx_joint_meeting_v451.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Pruebas reunion conjunta fallaron' }
