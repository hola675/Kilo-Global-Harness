name: Validar VX Dev Team Core
on:
  pull_request:
  push:
    branches: [main, 'work/**']
permissions:
  contents: read
jobs:
  core-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Sintaxis PowerShell del unico instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @('scripts/Instalar-DevTeam-Unificado.ps1', 'scripts/Eliminar-RamasFusionadas.ps1', 'scripts/Probar-Observador-Kilo.ps1')) {
            $f = (Resolve-Path $relative).Path
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count -ne 0) { throw "PowerShell invalido ($relative): $($errors | Out-String)" }
          }
      - name: Compilar motores y pruebas del Core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -m compileall -q scripts/vx_pack_bootstrap.py scripts/vx_pack_coexist_v023.py scripts/vx_unified_pack.py scripts/vx_task_dag.py scripts/vx_verify_metadata.py tools/dev_team_agent_parser.py tests/test_vx_unified_pack_v1.py
          if ($LASTEXITCODE -ne 0) { throw 'Error compilando Core actual.' }
      - name: Sintaxis observador Kilo fuente (no activacion)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VX_OBSERVER_ENABLE = '0'
          node --check runtime/kilo-observer/vx-runtime-observer.js
          if ($LASTEXITCODE -ne 0) { throw 'Observador JS inválido.' }
          node --check runtime/kilo-observer/lib/vx-observer-hooks.js
          if ($LASTEXITCODE -ne 0) { throw 'Normalizador de hooks inválido.' }
          node --test tests/test_vx_observer_contract.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Pruebas contractuales offline de hooks fallidas.' }
      - name: Preparar Bun aislado para prueba REAL de SQLite
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: SQLite Bun - contratos y persistencia sin Kilo ni HOME real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun test tests/vx_observer_sqlite.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'SQLite Bun contract test failed.' }
      - name: Laboratorio Windows - crear y verificar sin iniciar Kilo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lab = Join-Path $env:TEMP ('vx-observer-lab-ci-' + [guid]::NewGuid().ToString('N'))
          $script = (Resolve-Path 'scripts/Probar-Observador-Kilo.ps1').Path
          & $script -Modo Diagnostico -RaizLaboratorio $lab
          & $script -Modo Preparar -RaizLaboratorio $lab
          if (!(Test-Path (Join-Path $lab 'vx-observer-lab/.kilo/plugin/lib/vx-observer-hooks.js'))) {
            throw 'Plugin helper no incluido en laboratorio.'
          }
          & $script -Modo Verificar -RaizLaboratorio $lab
          if (Test-Path (Join-Path $lab 'state/vx-runtime-observations.sqlite3')) {
            throw 'Laboratorio creó SQLite sin ejecutar Kilo.'
          }
          & $script -Modo Limpiar -RaizLaboratorio $lab -ConfirmarLimpieza -ConfirmarLabCerrado
          if (Test-Path -LiteralPath $lab) { throw 'Cleanup lab no eliminó carpeta autorizada.' }
      - name: Verificar versiones individuales y fechas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I scripts/vx_verify_metadata.py
          if ($LASTEXITCODE -ne 0) { throw 'Metadatos VX inválidos.' }
      - name: Core 1.6 - contratos, permisos, DAG, SQLite, DPAPI y rollback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -m unittest discover -s tests -p 'test_vx_unified_pack_v1.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Core VX: regresion focal fallida.' }
      - name: Instalador unificado - diagnostico y simulacion sin mutaciones
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'vx-core-clean-install-lab'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $installer = (Resolve-Path 'scripts/Instalar-DevTeam-Unificado.ps1').Path
          & $installer -Modo Diagnostico -RaizUsuario $tmp
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostico del Core no es valido.' }
          & $installer -Modo Simular -RaizUsuario $tmp
          if ($LASTEXITCODE -ne 0) { throw 'Simulacion del Core no es valida.' }
          if (Test-Path (Join-Path $tmp '.config/kilo/agents/vx-dev-team.md')) {
            throw 'Simular modifico HOME.'
          }
          Write-Host 'SOURCE PASS. No se ha certificado el runtime Kilo Desktop.'
